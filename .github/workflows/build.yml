name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: |
          A=app/src/main
          mkdir -p $A/assets $A/java/com/hamzakufi/tajweed $A/res/layout $A/res/menu $A/res/values $A/res/drawable $A/res/mipmap-anydpi-v26
          mv app_build.gradle.kts app/build.gradle.kts
          mv book.pdf $A/assets/
          mv AndroidManifest.xml $A/
          mv MainActivity.kt $A/java/com/hamzakufi/tajweed/
          mv activity_main.xml $A/res/layout/
          mv main.xml $A/res/menu/
          mv strings.xml themes.xml colors.xml $A/res/values/
          mv ic_foreground.xml $A/res/drawable/
          mv ic_launcher.xml $A/res/mipmap-anydpi-v26/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
          else
            PASS="tajweed123456"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Tajweed, O=Hamza Kufi"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=key" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk al-qawl-al-rashid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: al-qawl-al-rashid.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: الإصدار ${{ github.run_number }}
          files: al-qawl-al-rashid.apk
